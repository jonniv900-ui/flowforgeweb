// Assinatura do build "release" (APK/AAB para a Play Store).
// Usado só quando as variáveis de ambiente abaixo existem (veja LEIA-ME.md):
//   KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application') && System.getenv('KEYSTORE_FILE')) {
            p.android {
                signingConfigs {
                    ffRelease {
                        storeFile p.file(System.getenv('KEYSTORE_FILE'))
                        storePassword System.getenv('KEYSTORE_PASSWORD')
                        keyAlias System.getenv('KEY_ALIAS')
                        keyPassword System.getenv('KEY_PASSWORD')
                    }
                }
                buildTypes {
                    release { signingConfig signingConfigs.ffRelease }
                }
            }
        }
    }
}
