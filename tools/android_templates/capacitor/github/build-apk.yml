name: Gerar APK

# Compila o app Android na nuvem do GitHub. Nenhuma instalação local é necessária.
# Envie este projeto para um repositório e abra a aba "Actions" (ou use "Run workflow").
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar o projeto Android (Capacitor)
        run: npx cap add android

      - name: Aplicar ícone, permissões, versão e orientação
        run: node scripts/prepare-android.js

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Opcional: APK + AAB assinados para publicar. Exige os "secrets" descritos no LEIA-ME.md
      - name: Compilar versão assinada (release)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease -I ../scripts/signing.init.gradle

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
