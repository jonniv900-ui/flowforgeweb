<!doctype html>
<meta charset="utf-8">
<title>FlowForge all components smoke</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1400px;height:950px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – todos os componentes: palco, export, runtimes e interações</h3>
<p>Adiciona um componente de cada tipo da toolbox, renderiza, exporta e exercita as interações reais no HTML gerado.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<iframe id="run"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+escHtml(name)+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+escHtml(name)+(detail!==undefined?'  → '+escHtml(JSON.stringify(detail)):'')+'\n');}
}
async function waitFor(fn,timeout=5000,step=40){
  const t0=performance.now();
  while(performance.now()-t0<timeout){try{if(fn())return true}catch(_){}await sleep(step)}
  return false;
}
const HIDDEN_IN_EXPORT=['gamesound','timer','keyboardinput','gamepadinput','gametimer','http','websocket','storage','geolocation','notification','clipboard','network','vibration'];
const GAME_KINDS=['gamecanvas','sprite','spritesheet','collisionarea','keyboardinput','gamepadinput','gametimer','scorelabel','healthbar','joystick'];
const SERVICE_KINDS=['http','websocket','storage','geolocation','notification','clipboard','network','vibration'];

async function run(){
  const FIRST=Math.max(0,Number(new URLSearchParams(location.search).get('first')||0));
  const appFrame=document.getElementById('app'),runFrame=document.getElementById('run');
  await new Promise(r=>appFrame.addEventListener('load',r,{once:true}));
  await sleep(700);
  let W,D;
  try{W=appFrame.contentWindow;D=appFrame.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  W.__auditErrs=[];
  W.addEventListener('error',e=>{if(e instanceof W.ErrorEvent)W.__auditErrs.push(e.message||String(e.error||'erro'))});
  W.addEventListener('unhandledrejection',e=>W.__auditErrs.push('rejection: '+String(e.reason&&e.reason.message||e.reason)));
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());

  $('[data-new=app]').click();
  await sleep(300);
  if($('#siteWizardDlg')?.open){$('#wizCreate').click();await sleep(500);}
  await sleep(300);closeDialogs();

  let kinds=[];
  try{
    kinds=W.eval(`(()=>{
      const all=[...new Set(Object.values(TOOL_GROUPS).flatMap(t=>t.map(x=>x[0])))];
      const kinds=${FIRST}?all.slice(0,${FIRST}):all;
      project.pages[0].items.length=0;
      kinds.forEach((k,i)=>{
        const it=toolDefaults(k);
        it.name='FF_'+k;
        it.x=10+(i%8)*165;
        it.y=10+Math.floor(i/8)*135;
        it.width='150px';it.height='110px';
        if(k==='camera')it.autoplay=false;
        if(k==='fab')it.events={click:'window.__auditFabClicks=(window.__auditFabClicks||0)+1;'};
        if(k==='pagenav')it.events={change:'window.__auditPnChanges=(window.__auditPnChanges||0)+1;'};
        if(k==='timer'){it.interval=50;it.events={tick:'window.__ffAuditTick=(window.__ffAuditTick||0)+1;'};}
        project.pages[0].items.push(it);
      });
      ffAddPage('Second');
      project.active=0;
      project.activePage=project.pages[0].id;
      selected=null;
      render();
      return kinds;
    })()`);
  }catch(e){
    check('montar o projeto com todos os componentes',false,e.message);
    summary.textContent='Falha ao montar';summary.className='fail';document.body.dataset.test='FAIL';return;
  }
  await sleep(900);

  /* ---------------- palco do editor ---------------- */
  const stage=W.eval(`(()=>{
    const kinds=${JSON.stringify(kinds)};
    return kinds.map(k=>{
      const el=document.querySelector('#stage .component.ff-kind-'+k);
      const r=el?el.getBoundingClientRect():null;
      return {k,found:!!el,html:el?(el.children.length||el.textContent.trim().length):0,w:r?Math.round(r.width):0,h:r?Math.round(r.height):0};
    });
  })()`);
  const missStage=stage.filter(x=>!x.found).map(x=>x.k);
  const emptyStage=stage.filter(x=>!x.html&&x.k!=='spacer').map(x=>x.k);
  const sizeStage=stage.filter(x=>!HIDDEN_IN_EXPORT.includes(x.k)&&(x.w<10||x.h<10)).map(x=>x.k);
  check(`palco: ${kinds.length} tipos de componente são criados`,missStage.length===0,missStage);
  check('palco: todos os componentes têm conteúdo renderizado',emptyStage.length===0,emptyStage);
  check('palco: todos os componentes visíveis têm largura/altura',sizeStage.length===0,sizeStage.map(k=>{const x=stage.find(s=>s.k===k);return [k,x.w,x.h]}));
  check('palco: renderizar todos não gera erro no editor',W.__auditErrs.length===0,W.__auditErrs.slice(0,5));

  /* ---------------- export ---------------- */
  let html='';
  try{html=W.generated();}catch(e){check('gerar o HTML exportado',false,e.message);}
  check('exportação gerada',html.length>30000,html.length);
  check('exportação contém todos os tipos',kinds.every(k=>html.includes('ff-kind-'+k)),kinds.filter(k=>!html.includes('ff-kind-'+k)));

  const patch=`<script>(function(){
    window.__errs=[];
    window.addEventListener('error',function(e){if(e instanceof ErrorEvent)window.__errs.push(e.message||String(e.error||'erro'))});
    window.addEventListener('unhandledrejection',function(e){window.__errs.push('rejection: '+String(e.reason&&e.reason.message||e.reason))});
    var ce=console.error;console.error=function(){window.__errs.push(Array.prototype.join.call(arguments,' '));ce.apply(console,arguments)};
  })();<\/script>`;
  const loaded=new Promise(r=>runFrame.addEventListener('load',r,{once:true}));
  runFrame.srcdoc=html.replace('<head>','<head>'+patch);
  await Promise.race([loaded,new Promise(r=>setTimeout(r,8000))]);
  const RW=runFrame.contentWindow;
  const ready=await waitFor(()=>RW.document.querySelectorAll('.ff-component').length>=kinds.length,5000);
  check('export: todos os componentes existem no DOM',ready,{count:RW.document.querySelectorAll('.ff-component').length,total:kinds.length});
  if(!ready){
    summary.textContent='Export não carregou';summary.className='fail';document.body.dataset.test='FAIL';return;
  }
  await sleep(500);

  const exp=RW.eval(`(()=>{
    const kinds=${JSON.stringify(kinds)};
    return kinds.map(k=>{
      const el=document.querySelector('.ff-component.ff-kind-'+k);
      const r=el?el.getBoundingClientRect():null;
      return {k,found:!!el,html:el?(el.children.length||el.textContent.trim().length):0,w:r?Math.round(r.width):0,h:r?Math.round(r.height):0,display:el?getComputedStyle(el).display:''};
    });
  })()`);
  const missExp=exp.filter(x=>!x.found).map(x=>x.k);
  const emptyExp=exp.filter(x=>!x.html&&x.k!=='spacer').map(x=>x.k);
  const sizeExp=exp.filter(x=>!HIDDEN_IN_EXPORT.includes(x.k)&&(x.w<10||x.h<10)).map(x=>x.k);
  const shownHidden=exp.filter(x=>HIDDEN_IN_EXPORT.includes(x.k)&&x.display!=='none').map(x=>x.k);
  check('export: todos os componentes são montados',missExp.length===0,missExp);
  check('export: todos os componentes têm conteúdo',emptyExp.length===0,emptyExp);
  check('export: componentes visíveis têm tamanho',sizeExp.length===0,sizeExp);
  check('export: componentes não visuais ficam ocultos',shownHidden.length===0,shownHidden);

  /* ---------------- runtimes e proxies ---------------- */
  const G=RW.FlowForgeGame,S=RW.FlowForgeServices;
  check('export: runtime de jogos e serviços ativo',!!G&&!!S);
  const gameBad=[];
  if(G)for(const k of GAME_KINDS){const api=G.byName('FF_'+k);if(!api||!api.id)gameBad.push(k)}
  check('export: API de todos os componentes de jogo',gameBad.length===0,gameBad);
  const svcBad=[];
  if(S)for(const k of SERVICE_KINDS){const api=S.byName('FF_'+k);if(!api||!api.id)svcBad.push(k)}
  check('export: API de todos os serviços',svcBad.length===0,svcBad);
  check('export: canvas de jogo inicia com contexto 2D',G&&G.byName('FF_gamecanvas').running===true&&!!G.byName('FF_gamecanvas').ctx);
  check('export: som do jogo tem runtime',!!RW.FlowForgeSound&&typeof RW.FlowForgeSound.play==='function');
  const proxyBad=kinds.filter(k=>!RW['FF_'+k]&&!RW['_'+k]);
  check('export: proxy global existe para todos os componentes',proxyBad.length===0,proxyBad);

  /* ---------------- interações ---------------- */
  const ui=RW.eval(`(()=>{
    const D=document,out={},q=s=>D.querySelector(s);
    const cb=q('.ff-kind-checkbox input');if(cb){cb.click();out.checkbox=cb.checked}
    const sw=q('.ff-kind-switch input');if(sw){sw.click();out.switch=sw.checked}
    const rg=q('.ff-kind-range input');if(rg){rg.value='77';rg.dispatchEvent(new Event('input',{bubbles:true}));out.range=rg.value}
    const sel=q('.ff-kind-select select');if(sel){sel.selectedIndex=Math.min(1,sel.options.length-1);sel.dispatchEvent(new Event('change',{bubbles:true}));out.select=sel.value}
    const cp=q('.ff-kind-colorpicker input');if(cp){cp.value='#123456';out.color=cp.value}
    const dt=q('.ff-kind-date input');if(dt){dt.value='2026-10-26';out.date=dt.value}
    const acc=q('.ff-kind-accordion details');if(acc){acc.querySelector('summary').click();out.accordion=acc.open}
    const rt=q('.ff-kind-rating .ff-real-rating');if(rt){rt.querySelectorAll('button')[2].click();out.rating=rt.dataset.value;out.ratingSel=rt.querySelectorAll('button.selected').length}
    const st=q('.ff-kind-stepper .ff-real-stepper');if(st){st.querySelectorAll('button')[1].click();out.stepper=st.dataset.step}
    const cr=q('.ff-kind-carousel .ff-real-carousel');if(cr){cr.querySelectorAll('button')[1].click();out.carousel=cr.dataset.index;out.carouselShown=[...cr.querySelectorAll('.ff-carousel-slides>div')].filter(x=>!x.hidden).length}
    const led=q('.ff-kind-led .ff-real-led');if(led){led.click();out.led=led.getAttribute('aria-pressed')}
    const li=q('.ff-kind-list .ff-real-list button');if(li){li.click();out.list=li.classList.contains('selected')}
    const dr=q('.ff-kind-drawer');if(dr){const t=dr.querySelector('.ff-nav-toggle');if(t){t.click();out.drawer=dr.querySelector('.ff-real-drawer').classList.contains('open')}}
    const bs=q('.ff-kind-bottomsheet');if(bs){const t=bs.querySelector('.ff-nav-toggle');if(t){t.click();out.sheet=!bs.querySelector('.ff-sheet-body').hidden}}
    const fb=q('.ff-kind-fab');if(fb){const t=fb.querySelector('.ff-real-fab');if(t){t.click();out.fab=!fb.querySelector('.ff-fab-menu').hidden;out.fabClicks=window.__auditFabClicks||0}}
    const ts=q('.ff-kind-toast .ff-real-toast');if(ts){ts.querySelector('button').click();out.toast=ts.hidden}
    const md=q('.ff-kind-modal dialog');if(md){window.FF_modal.showModal();out.modal=md.open;window.FF_modal.close()}
    const ch=q('.ff-kind-chart svg');if(ch)out.chartShapes=ch.querySelectorAll('rect,path,circle,polyline,text').length;
    const sp=q('canvas[data-ff-sparkline]');if(sp){const g=sp.getContext('2d'),d=g.getImageData(0,0,sp.width,sp.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;out.sparkPixels=n}
    const qr=q('.ff-kind-qrcode img');if(qr)out.qr=qr.src.indexOf('data:image')===0&&qr.naturalWidth>0;
    const camera=q('.ff-kind-camera video');if(camera)out.camera=camera.getAttribute('autoplay')===null;
    return out;
  })()`);
  check('checkbox alterna',ui.checkbox===true,ui.checkbox);
  check('switch alterna',ui.switch===true,ui.switch);
  check('slider aceita valor',ui.range==='77',ui.range);
  check('select aceita troca',typeof ui.select==='string'&&ui.select.length>0,ui.select);
  check('color picker aceita cor',ui.color==='#123456',ui.color);
  check('date aceita data',ui.date==='2026-10-26',ui.date);
  check('accordion abre ao clicar',ui.accordion===true,ui.accordion);
  check('rating marca estrelas',ui.rating==='3'&&ui.ratingSel===3,{v:ui.rating,n:ui.ratingSel});
  check('stepper avança',ui.stepper==='2',ui.stepper);
  check('carousel troca de slide',ui.carousel==='1'&&ui.carouselShown===1,{i:ui.carousel,n:ui.carouselShown});
  check('LED alterna',ui.led==='true',ui.led);
  check('lista seleciona item',ui.list===true,ui.list);
  check('drawer abre',ui.drawer===true,ui.drawer);
  check('bottom sheet abre',ui.sheet===true,ui.sheet);
  check('FAB abre menu (toggle embutido preservado)',ui.fab===true,ui.fab);
  check('FAB também executa o evento do usuário',ui.fabClicks===1,ui.fabClicks);
  check('toast fecha',ui.toast===true,ui.toast);
  check('modal abre e fecha',ui.modal===true,ui.modal);
  check('chart desenha em SVG',ui.chartShapes>5,ui.chartShapes);
  check('sparkline desenha no canvas',ui.sparkPixels>50,ui.sparkPixels);
  check('QR Code gera imagem',ui.qr===true,ui.qr);
  check('camera não inicia sozinha quando autoplay=false',ui.camera===true,ui.camera);

  const nav=RW.eval(`(()=>{
    const pages=window.__FLOWFORGE_PAGES__,first=pages[0].id,second=pages[1].id;
    const btn=document.querySelector('.ff-kind-navbar [data-page-id="'+CSS.escape(second)+'"]');
    if(!btn)return {error:'sem botão'};
    btn.click();
    const active=()=>[...document.querySelectorAll('.ff-page')].find(p=>!p.hidden&&!p.classList.contains('hidden'));
    const after=active()&&active().dataset.pageId;
    window.FlowForgeNavigate(first);
    return {after,back:active()&&active().dataset.pageId,second};
  })()`);
  check('navbar navega para a segunda página',!nav.error&&nav.after===nav.second,nav);
  check('navbar volta para a primeira página',nav.back===RW.__FLOWFORGE_PAGES__[0].id,nav);

  const pn=RW.eval(`(()=>{
    const sel=document.querySelector('.ff-kind-pagenav select');if(!sel)return {error:'sem pagenav'};
    const pages=window.__FLOWFORGE_PAGES__,second=pages[1].id,first=pages[0].id;
    sel.value=second;sel.dispatchEvent(new Event('change',{bubbles:true}));
    const active=()=>[...document.querySelectorAll('.ff-page')].find(p=>!p.hidden&&!p.classList.contains('hidden'));
    const after=active()&&active().dataset.pageId;
    window.FlowForgeNavigate(first);
    return {after,second,changes:window.__auditPnChanges||0};
  })()`);
  check('pagenav navega (onchange embutido preservado)',!pn.error&&pn.after===pn.second,pn);
  check('pagenav também executa o evento do usuário',pn.changes===1,pn.changes);

  await sleep(1400);
  check('timer dispara tick no export',(RW.__ffAuditTick||0)>=1,RW.__ffAuditTick||0);

  check('export: nenhum erro de runtime',RW.__errs.length===0,RW.__errs.slice(0,5));
  check('editor: nenhum erro durante a auditoria',W.__auditErrs.length===0,W.__auditErrs.slice(0,5));

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações (${kinds.length} componentes)`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{
  out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+escHtml(e&&e.stack||e&&e.message||e)+'\n');
  summary.textContent='Erro no teste';summary.className='fail';document.body.dataset.test='FAIL';
});
</script>
